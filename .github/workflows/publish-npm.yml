# Publish @nrouter/nbot to npm on push to main (when packages/nbot/package.json version bumps).
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed once registered on npmjs.com.
name: Publish @nrouter/nbot to npm

on:
  push:
    branches: [main]
    paths:
      - 'packages/nbot/**'
      - '.github/workflows/publish-npm.yml'
  pull_request:
    paths:
      - 'packages/nbot/**'
      - '.github/workflows/publish-npm.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nbot
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck, build, and test @nrouter/nbot
        run: |
          bun run typecheck
          bun run build
          bun test tests/

      - name: Check if version is already published
        id: check
        if: github.event_name != 'pull_request'
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          LIVE_VER=$(npm view "$PKG_NAME" version 2>/dev/null || echo "")
          echo "local=$PKG_VER live=$LIVE_VER"
          if [ "$PKG_VER" = "$LIVE_VER" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @nrouter/nbot to npm
        if: github.event_name != 'pull_request' && steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public
